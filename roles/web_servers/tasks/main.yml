- name: Install Apache and PHP for Ubuntu servers
  apt:
    name:
      - apache2
      - libapache2-mod-php
    state: latest
    update_cache: yes
  when: ansible_distribution == "Ubuntu"

- name: Install Apache and PHP for CentOS servers
  dnf:
    name:
      - httpd
      - php
    state: latest
  when: ansible_distribution == "CentOS"

- name: Start and enable httpd (CentOS)
  tags:
    - apache
    - centos
    - httpd
  service:
    name: httpd
    state: started
    enabled: yes
  when: ansible_distribution == "CentOS"

- name: Change ServerAdmin email address (CentOS)
  tags:
    - apache
    - centos
    - httpd
  lineinfile:
    path: /etc/httpd/conf/httpd.conf
    regexp: '^ServerAdmin'
    line: 'ServerAdmin somebody@somewhere.net'
  when: ansible_distribution == "CentOS"
  register: httpd_config

- name: Restart httpd if config changed (CentOS)
  tags:
    - apache
    - centos
    - httpd
  service:
    name: httpd
    state: restarted
  when: httpd_config.changed

- name: Copy default HTML file for site
  tags:
    - apache
    - apache2
    - httpd
  copy:
    src: default_site.html
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: '0644'
